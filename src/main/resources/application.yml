spring:
  application:
    name: api-acervo-digital
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dsv}
  servlet:
    multipart:
      max-file-size: ${ACERVO_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${ACERVO_MAX_REQUEST_SIZE:50MB}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:db-acervo-digital}
    username: ${DB_USERNAME:acervo_digital_app}
    password: ${DB_PASSWORD:acervo_digital_app}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        "[default_schema]": ${DB_SCHEMA:sc-acervo-digital}
        jdbc:
          "[time_zone]": UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: ${DB_SCHEMA:sc-acervo-digital}
    default-schema: ${DB_SCHEMA:sc-acervo-digital}
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:${OAUTH2_ISSUER_URI:}}
          jwk-set-uri: ${JWT_JWK_SET_URI:${OAUTH2_JWK_SET_URI:}}

server:
  port: 8080
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: OpenAPI (runtime - JSON)
        url: /v3/api-docs
      - name: OpenAPI (estático - YAML)
        url: /openapi/openapi.yaml
    urls-primary-name: OpenAPI (runtime - JSON)

security:
  mode: ${SECURITY_MODE:oauth2}
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}

integrations:
  vessels:
    base-url: ${VESSELS_BASE_URL:${API_EMBARCACOES_BASE_URL:http://localhost:18006}}

acervo:
  api:
    base-path: /api/v1
  security:
    signed-url-secret: ${ACERVO_SIGNED_URL_SECRET:}
  storage:
    provider: ${ACERVO_STORAGE_PROVIDER:local}
    quarantine-bucket: ${ACERVO_QUARANTINE_BUCKET:viafluvial-acervo-digital-quarantine-dsv}
    public-media-bucket: ${ACERVO_PUBLIC_MEDIA_BUCKET:viafluvial-acervo-digital-public-media-dsv}
    private-documents-bucket: ${ACERVO_PRIVATE_DOCUMENTS_BUCKET:viafluvial-acervo-digital-private-documents-dsv}
    cdn-base-url: ${ACERVO_CDN_BASE_URL:https://cdn.viafluvial.com.br}
    local-base-path: ${ACERVO_STORAGE_LOCAL_BASE_PATH:./storage}
    gcp-project-id: ${ACERVO_GCP_PROJECT_ID:}
    gcp-credentials-file: ${ACERVO_GCP_CREDENTIALS_FILE:}
  watermark:
    enabled: ${ACERVO_WATERMARK_ENABLED:true}
    logo-path: ${ACERVO_WATERMARK_LOGO_PATH:classpath:watermark/viafluvial-watermark.png}
    opacity: ${ACERVO_WATERMARK_OPACITY:0.08}
    scale-ratio: ${ACERVO_WATERMARK_SCALE_RATIO:0.04}
    margin-ratio: ${ACERVO_WATERMARK_MARGIN_RATIO:0.02}
  upload:
    max-image-size-bytes: ${ACERVO_MAX_IMAGE_SIZE_BYTES:10485760}  # 10 MB
    max-video-size-bytes: ${ACERVO_MAX_VIDEO_SIZE_BYTES:524288000}  # 500 MB
    max-document-size-bytes: ${ACERVO_MAX_DOCUMENT_SIZE_BYTES:52428800}  # 50 MB
    allowed-image-mimes:
      - image/jpeg
      - image/png
      - image/webp
      - image/tiff
    allowed-video-mimes:
      - video/mp4
      - video/quicktime
      - video/x-msvideo
      - video/x-matroska
    allowed-document-mimes:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
